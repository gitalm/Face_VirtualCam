<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Face-Tracking-Avatar</title>
  <style>
    :root { --bg: #00B140; }
    body { font-family: system-ui, sans-serif; text-align: center; margin: 0; padding: 1rem; background: #f4f6fb; }
    h1 { margin: .2rem 0 .6rem; font-size: 1.5rem; }
    .ui { display: flex; gap: .8rem; justify-content: center; flex-wrap: wrap; align-items: center; margin-bottom: .6rem; }
    button, select { font-size: 1rem; padding: .5rem 1rem; border-radius: 8px; cursor: pointer; }
    #status { color: #444; }
    #stage { display: flex; flex-wrap: wrap; gap: 1rem; justify-content: center; align-items: flex-start; }
    #avatar { width: min(90vw, 560px); background: var(--bg); border-radius: 16px; overflow: hidden; }
    #avatar svg { display: block; width: 100%; height: auto; }
    #camBox { position: relative; }
    #cam { width: 240px; border-radius: 16px; transform: scaleX(-1); background: #222; display: block; }
    #camBox small { display: block; color: #666; margin-top: .3rem; }
    #hint { color: #666; font-size: .9rem; }

    /* Greenscreen-Modus: nur noch der Avatar */
    body.clean { background: var(--bg); padding: 0; overflow: hidden; cursor: none; }
    body.clean .ui, body.clean #camBox, body.clean h1, body.clean #hint { display: none; }
    body.clean #stage { display: block; }
    body.clean #avatar { width: min(100vw, 100vh); height: min(100vw, 100vh); margin: 0 auto; border-radius: 0; }

    #toast {
      position: fixed; left: 50%; bottom: 1rem; transform: translateX(-50%);
      background: #000a; color: #fff; padding: .5rem 1rem; border-radius: 8px;
      opacity: 0; transition: opacity .4s; pointer-events: none;
    }
    #toast.show { opacity: 1; }
  </style>
</head>
<body>
  <h1>Face-Tracking-Avatar</h1>

  <div class="ui">
    <button id="start">Kamera starten</button>
    <label>Figur: <select id="figSelect"></select></label>
    <label>Hintergrund:
      <select id="bgSelect">
        <option value="#00B140">Greenscreen (#00B140)</option>
        <option value="#00FF00">Hellgrün (#00FF00)</option>
        <option value="#0047BB">Bluescreen (#0047BB)</option>
        <option value="#FF00FF">Magenta (#FF00FF)</option>
        <option value="#dfe8ff">Hellblau (neutral)</option>
      </select>
    </label>
    <button id="cleanBtn">🟩 Greenscreen-Ansicht</button>
  </div>
  <p id="status" class="ui">Die Kamerabilder werden nur lokal in deinem Browser verarbeitet.</p>
  <p id="hint">Taste <b>R</b>: Haltung neu kalibrieren (gerade in die Kamera schauen) · Taste <b>T</b> gedrückt halten: Zunge testen</p>

  <div id="stage">
    <div id="camBox">
      <video id="cam" autoplay playsinline muted></video>
      <small>Kamera-Test (gespiegelt)</small>
    </div>
    <div id="avatar" aria-label="Animierte Figur"></div>
  </div>

  <div id="toast">Beenden mit Esc oder Doppelklick</div>

  <script type="module">
    import { FaceLandmarker, FilesetResolver } from "./vendor/vision_bundle.mjs";

    const $ = (id) => document.getElementById(id);
    const video = $("cam"), status = $("status"), startBtn = $("start");
    const root = document.documentElement;

    // ================= Einstellungen =================
    const NOSE_GAIN   = 2.0;   // Stärke der Nasenbewegung (1 = wie vorher)
    const TONGUE_GAIN = 6;     // Verstärkung des Blendshapes tongueOut
    const DZ_ROLL = 1.5, DZ_YAW = 3, DZ_TILT = 3;   // Totzonen in Grad

    // ================= Zustand =================
    const state = {};
    let dist0 = null;          // Referenzabstand
    let base = null;           // Referenzhaltung {roll, yaw, tilt}
    let forceTongue = false;   // Taste T

    // ================= Hintergrund =================
    const savedBg = localStorage.getItem("avatarBg");
    if (savedBg) { root.style.setProperty("--bg", savedBg); $("bgSelect").value = savedBg; }
    $("bgSelect").addEventListener("change", (e) => {
      root.style.setProperty("--bg", e.target.value);
      localStorage.setItem("avatarBg", e.target.value);
    });

    // ================= Greenscreen-Ansicht und Tasten =================
    function toast(text) {
      const t = $("toast");
      if (text) t.textContent = text;
      t.classList.add("show");
      setTimeout(() => t.classList.remove("show"), 2500);
    }
    function setClean(on) {
      document.body.classList.toggle("clean", on);
      if (on) toast("Beenden mit Esc oder Doppelklick");
    }
    $("cleanBtn").addEventListener("click", () => setClean(true));
    document.addEventListener("dblclick", () => {
      if (document.body.classList.contains("clean")) setClean(false);
    });
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") setClean(false);
      if (e.key === "r" || e.key === "R") {
        dist0 = null; base = null;            // wird beim nächsten Gesicht neu gesetzt
        toast("Haltung kalibriert");
      }
      if (e.key === "t" || e.key === "T") forceTongue = true;
    });
    document.addEventListener("keyup", (e) => {
      if (e.key === "t" || e.key === "T") forceTongue = false;
    });
    if (new URLSearchParams(location.search).has("clean")) setClean(true);

    // ================= Figuren-Ordner durchsuchen =================
    async function listFigures() {
      // 1) Liste figures.json (funktioniert auch auf GitHub Pages)
      try {
        const r = await fetch("./assets/figures.json", { cache: "no-cache" });
        if (r.ok) {
          const list = await r.json();
          if (Array.isArray(list) && list.length) return list;
        }
      } catch {}
      // 2) Verzeichnisliste des Servers (lokal)
      try {
        const r = await fetch("./assets/", { cache: "no-cache" });
        if (r.ok) {
          const doc = new DOMParser().parseFromString(await r.text(), "text/html");
          const files = [...doc.querySelectorAll("a")]
            .map((a) => decodeURIComponent(a.getAttribute("href") || "").split("/").pop())
            .filter((n) => n.toLowerCase().endsWith(".svg"));
          if (files.length) return [...new Set(files)];
        }
      } catch {}
      // 3) Notlösung
      return ["philosoph.svg", "smiley.svg"];
    }

    // ================= Figurenwerte =================
    const KNOWN = {
      "philosoph.svg": {
        mouth: { cx: 348, cy: 358, halfW: 30, openMax: 40 },
        lid: 42, lookX: 12, lookY: 6,
        brow: { inner: 190, outer: 198, up: 18 },
        noseLift: 6, noseShift: 0.45
      },
      "smiley.svg": {
        mouth: { cx: 360, cy: 485, halfW: 60, openMax: 90 },
        lid: 112, lookX: 22, lookY: 12,
        brow: { inner: 190, outer: 198, up: 30 },
        noseLift: 12, noseShift: 0.9
      }
    };

    function deriveConfig(el) {
      const cfg = {
        mouth: { cx: 360, cy: 500, halfW: 40, openMax: 60 },
        lid: 60, lookX: 12, lookY: 6,
        brow: { inner: 190, outer: 198, up: 20 },
        noseLift: 8, noseShift: 0.6
      };
      try {
        const m = el.mouthLine.getBBox();
        const halfW = m.width / 2;
        cfg.mouth = { cx: m.x + halfW, cy: m.y + m.height / 2, halfW, openMax: halfW * 1.3 };
        const ib = el.irisL.getBBox();
        cfg.lid = ib.height * 2.2;
        cfg.lookX = ib.width * 0.6;
        cfg.lookY = ib.height * 0.3;
        cfg.brow = {
          inner: +el.browR[0].getAttribute("y1"),
          outer: +el.browR[0].getAttribute("y2"),
          up: halfW * 0.6
        };
        cfg.noseLift = halfW * 0.2;
        cfg.noseShift = halfW * 0.015;
      } catch {}
      return cfg;
    }

    // ================= Figur laden =================
    let el = {}, cfg = null, tongue = null;
    const dummy = document.createElementNS("http://www.w3.org/2000/svg", "g");

    async function loadFigure(file) {
      const res = await fetch("./assets/" + encodeURIComponent(file));
      if (!res.ok) throw new Error("Datei nicht gefunden (" + res.status + ")");
      $("avatar").innerHTML = await res.text();
      localStorage.setItem("avatarFig", file);
      $("figSelect").value = file;

      const q = (id) => $("avatar").querySelector("#" + id) || dummy;
      el = {
        head: q("head"),
        body: q("body"), shoulderL: q("shoulderL"), shoulderR: q("shoulderR"),
        irisL: q("irisL"), irisR: q("irisR"),
        lidL: q("lidL"), lidR: q("lidR"),
        browL: [q("browL"), q("browL2")],
        browR: [q("browR"), q("browR2")],
        nose: q("nose"),
        mouthFill: q("mouthFill"), mouthLine: q("mouthLine")
      };
      el.nose.style.transformBox = "fill-box";
      el.nose.style.transformOrigin = "center";

      // Zunge: vom Skript erzeugt, liegt ganz oben im Kopf (über Bart und Schnurrbart)
      tongue = document.createElementNS("http://www.w3.org/2000/svg", "path");
      tongue.setAttribute("fill", "#ee5f7c");
      tongue.setAttribute("stroke", "#8f2a2a");
      tongue.setAttribute("stroke-linejoin", "round");
      tongue.setAttribute("stroke-linecap", "round");
      tongue.setAttribute("d", "");
      if (el.head !== dummy) el.head.appendChild(tongue);

      // Werte: berechnet -> bekannt -> data-fig im <svg>-Tag
      let override = {};
      try { override = JSON.parse($("avatar").querySelector("svg")?.dataset.fig || "{}"); } catch {}
      cfg = { ...deriveConfig(el), ...(KNOWN[file] || {}), ...override };
      requestAnimationFrame(() => drawMouth(0, 0.1, 0, 0));
    }

    // ================= Hilfsfunktionen =================
    const smooth = (key, v, a = 0.4) =>
      (state[key] = key in state ? state[key] * (1 - a) + v * a : v);
    const get = (shapes, name) => shapes.find((s) => s.categoryName === name)?.score ?? 0;
    const setBrow = (lines, y1, y2) =>
      lines.forEach((l) => { l.setAttribute("y1", y1); l.setAttribute("y2", y2); });
    // Totzone: kleine Werte werden ignoriert, große weich übernommen
    const dz = (v, d) => Math.sign(v) * Math.max(0, Math.abs(v) - d);

    // ================= Mund und Zunge =================
    function drawMouth(open, smile, pucker, tg = 0) {
      const { cx, cy, halfW: w, openMax } = cfg.mouth;
      const halfW = w - pucker * w * 0.45;
      const yc = cy - smile * w * 0.27;
      const xl = cx - halfW, xr = cx + halfW;
      const openH = open * openMax;
      const upperCtrl = cy - w * 0.13;
      const lowerCtrl = cy + openH * 1.3 + w * 0.13;

      if (openH > 2) {
        el.mouthFill.setAttribute("d",
          `M${xl} ${yc} Q${cx} ${upperCtrl} ${xr} ${yc} Q${cx} ${lowerCtrl} ${xl} ${yc}Z`);
        el.mouthLine.setAttribute("d",
          `M${xl} ${yc} Q${cx} ${lowerCtrl} ${xr} ${yc} M${xl} ${yc} Q${cx} ${upperCtrl} ${xr} ${yc}`);
      } else {
        el.mouthFill.setAttribute("d", "");
        el.mouthLine.setAttribute("d",
          `M${xl} ${yc} Q${cx} ${cy + w * 0.13 + smile * w * 0.33} ${xr} ${yc}`);
      }

      // Zunge: breit, mit Mittelrille, länger je stärker tongueOut
      if (tongue) {
        if (tg > 0.05) {
          const len = tg * w * 1.7 + openH * 0.4;
          const tw = w * 0.42;
          const y0 = yc + openH * 0.15;
          tongue.setAttribute("stroke-width", Math.max(2.5, w * 0.09));
          tongue.setAttribute("d",
            `M${cx - tw} ${y0} L${cx - tw} ${y0 + len * 0.55} ` +
            `Q${cx - tw} ${y0 + len} ${cx} ${y0 + len} ` +
            `Q${cx + tw} ${y0 + len} ${cx + tw} ${y0 + len * 0.55} L${cx + tw} ${y0}Z ` +
            `M${cx} ${y0 + len * 0.2} L${cx} ${y0 + len * 0.65}`);
        } else {
          tongue.setAttribute("d", "");
        }
      }
    }

    // ================= Kopf =================
    // roll: Neigung links/rechts, yaw: Drehung, tilt: Nicken (alle relativ zur Grundhaltung)
    // near: Nähe zur Kamera (-1 weit weg … +1 sehr nah)
    function moveHead(roll, yaw, tilt, near) {
      const t = performance.now();
      const swayRoll = Math.sin(t / 2300) * 1.5 + Math.sin(t / 1370) * 0.8;   // Grad
      const swayX = Math.sin(t / 3100) * 3;                                  // Pixel

      const scale   = 1 + near * 0.12;
      const forward = Math.max(0, near) * 22 + tilt * 0.4;                   // Vorneigen
      const squashY = 1 - Math.max(0, near) * 0.04 - Math.abs(tilt) * 0.002;

      // Pseudo-3D-Drehung
      const turn    = Math.max(-1, Math.min(1, yaw / 30));
      const skewY   = -turn * 2.5;
      const squashX = 1 - Math.abs(turn) * 0.05;

      el.head.style.transform =
        `translate(${yaw * 0.8 + swayX}px, ${forward}px) ` +
        `rotate(${roll + swayRoll}deg) ` +
        `skewY(${skewY}deg) ` +
        `scale(${scale * squashX}, ${scale * squashY})`;
    }

    // ================= Körper und Schultern =================
    function moveBody(t, roll, yaw, tilt, near) {
      const breath = Math.sin(t / 1100);
      const bx = smooth("bodyX", yaw * 0.5, 0.06);
      const br = smooth("bodyRoll", roll * 0.3, 0.06);
      const by = smooth("bodyY", tilt * 0.4, 0.08);
      const bs = smooth("bodyScale", 1 + near * 0.08, 0.08);     // Körper wächst mit
      const shrug = smooth("shrug", (state.browUp ?? 0) * 14, 0.1);

      if (el.body !== dummy) {
        el.body.style.transform =
          `translate(${bx}px, ${breath * 3 + by}px) rotate(${br}deg) scale(${bs})`;
      }

      const turnL = Math.max(0, yaw) * 0.25;
      const turnR = Math.max(0, -yaw) * 0.25;
      if (el.shoulderL !== dummy) {
        el.shoulderL.style.transform =
          `translateY(${-(shrug + breath * 2 + turnL)}px) rotate(${-shrug * 0.15}deg)`;
      }
      if (el.shoulderR !== dummy) {
        el.shoulderR.style.transform =
          `translateY(${-(shrug + breath * 2 + turnR)}px) rotate(${shrug * 0.15}deg)`;
      }
    }

    // ================= Animation =================
    // Spiegelprinzip: linkes Auge der Person = rechtes Auge im Bild
    function apply(shapes, matrix) {
      const g = (n) => get(shapes, n);

      // Blinzeln
      el.lidR.setAttribute("height", smooth("blinkL", g("eyeBlinkLeft"), 0.6) * cfg.lid);
      el.lidL.setAttribute("height", smooth("blinkR", g("eyeBlinkRight"), 0.6) * cfg.lid);

      // Blick
      const lookX = smooth("lookX",
        (g("eyeLookOutLeft") - g("eyeLookInLeft") +
         g("eyeLookInRight") - g("eyeLookOutRight")) / 2);
      const lookY = smooth("lookY",
        (g("eyeLookDownLeft") + g("eyeLookDownRight") -
         g("eyeLookUpLeft") - g("eyeLookUpRight")) / 2);
      const t = `translate(${-lookX * cfg.lookX} ${lookY * cfg.lookY})`;
      el.irisL.setAttribute("transform", t);
      el.irisR.setAttribute("transform", t);

      // Augenbrauen
      const { inner, outer, up: u } = cfg.brow;
      const inUp = smooth("browUp", g("browInnerUp"));
      const dL = smooth("dL", g("browDownLeft")),  dR = smooth("dR", g("browDownRight"));
      const oL = smooth("oL", g("browOuterUpLeft")), oR = smooth("oR", g("browOuterUpRight"));
      setBrow(el.browR,
        inner - inUp * u + dL * u * 0.7,
        outer - inUp * u / 3 - oL * u * 0.9 + dL * u / 3);
      setBrow(el.browL,
        outer - inUp * u / 3 - oR * u * 0.9 + dR * u / 3,
        inner - inUp * u + dR * u * 0.7);

      // Mund und Zunge
      let tg = smooth("tongue", Math.min(1, g("tongueOut") * TONGUE_GAIN), 0.4);
      if (forceTongue) tg = 1;                                   // Test mit Taste T
      const open = smooth("open", Math.max(g("jawOpen"), tg * 0.6));
      const smile = smooth("smile",
        ((g("mouthSmileLeft") + g("mouthSmileRight")) -
         (g("mouthFrownLeft") + g("mouthFrownRight"))) / 2 * 1.4);
      drawMouth(open, Math.max(-1, Math.min(1, smile)), smooth("pucker", g("mouthPucker")), tg);

      // Kopfhaltung, relativ zur Grundhaltung (Kalibrierung mit R)
      let roll = 0, yaw = 0, tilt = 0, near = state.near ?? 0;
      if (matrix) {
        const m = matrix.data;
        const rRoll = smooth("rawRoll", Math.atan2(m[1], m[0]) * 180 / Math.PI);
        const rYaw  = smooth("rawYaw",  Math.asin(Math.max(-1, Math.min(1, -m[8]))) * 180 / Math.PI);
        const rTilt = smooth("rawTilt", Math.asin(Math.max(-1, Math.min(1,  m[9]))) * 180 / Math.PI);
        const dist  = Math.abs(m[14]);

        if (!base) base = { roll: rRoll, yaw: rYaw, tilt: rTilt };
        if (dist0 === null) dist0 = dist;

        roll = dz(rRoll - base.roll, DZ_ROLL);
        yaw  = dz(rYaw  - base.yaw,  DZ_YAW);
        tilt = dz(rTilt - base.tilt, DZ_TILT);
        near = smooth("near", Math.max(-1, Math.min(1, (dist0 - dist) / 25)), 0.15);

        state.cRoll = roll; state.cYaw = yaw; state.cTilt = tilt;
      }
      moveHead(roll, yaw, tilt, near);
      moveBody(performance.now(), roll, yaw, tilt, near);

      // Nase: Rümpfen bewegt sie deutlich, alles andere nur dezent und begrenzt
      const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
      const sneer  = smooth("sneer", (g("noseSneerLeft") + g("noseSneerRight")) / 2, 0.3);
      const sneerD = smooth("sneerD", g("noseSneerLeft") - g("noseSneerRight"), 0.3);
      const smileN = smooth("smileN", (g("mouthSmileLeft") + g("mouthSmileRight")) / 2, 0.2);
      const breathN = Math.sin(performance.now() / 1100) * 0.006;

      const L = cfg.noseLift * NOSE_GAIN;

      // Seitenversatz: nur ein kleiner 3D-Effekt, hart begrenzt
      const nx = clamp(yaw * cfg.noseShift * 0.25, -6, 6) + sneerD * L * 0.4;
      // Hoch nur beim Rümpfen, beim Lächeln minimal
      const ny = -sneer * L - smileN * L * 0.1;
      const sx = 1 + sneer * 0.25 * NOSE_GAIN * 0.7 + smileN * 0.04 + breathN;
      const sy = 1 + sneer * 0.08 * NOSE_GAIN * 0.7 + breathN;
      const rot = sneerD * 8;

      el.nose.style.transform =
        `translate(${nx}px, ${ny}px) rotate(${rot}deg) scale(${sx}, ${sy})`;

    // ================= Schleife (läuft immer, auch vor dem Kamerastart) =================
    let landmarker = null, lastTime = -1;
    function loop() {
      let tracked = false;
      try {
        if (landmarker && video.readyState >= 2 && video.currentTime !== lastTime) {
          lastTime = video.currentTime;
          const r = landmarker.detectForVideo(video, performance.now());
          if (r.faceBlendshapes?.length > 0) {
            apply(r.faceBlendshapes[0].categories, r.facialTransformationMatrixes?.[0]);
            tracked = true;
          }
        }
        // Ohne neue Gesichtsdaten: leichtes Eigenleben
        if (!tracked && cfg) {
          const n = state.near ?? 0;
          moveHead(state.cRoll ?? 0, state.cYaw ?? 0, state.cTilt ?? 0, n);
          moveBody(performance.now(), state.cRoll ?? 0, state.cYaw ?? 0, state.cTilt ?? 0, n);
        }
      } catch (err) {
        console.error(err);
      }
      requestAnimationFrame(loop);
    }

    // ================= Start =================
    const files = await listFigures();
    $("figSelect").innerHTML = files
      .map((f) => `<option value="${f}">${f.replace(/\.svg$/i, "")}</option>`).join("");

    async function safeLoad(file) {
      try {
        await loadFigure(file);
      } catch (err) {
        console.error("Figur konnte nicht geladen werden:", file, err);
        status.textContent = "Fehler bei „" + file + "“: " + err.message;
      }
    }

    $("figSelect").addEventListener("change", (e) => safeLoad(e.target.value));
    const saved = localStorage.getItem("avatarFig");
    await safeLoad(files.includes(saved) ? saved : files[0]);
    loop();

    startBtn.addEventListener("click", async () => {
      startBtn.disabled = true;
      try {
        status.textContent = "Modell wird geladen …";
        const fileset = await FilesetResolver.forVisionTasks("./vendor/wasm");
        landmarker = await FaceLandmarker.createFromOptions(fileset, {
          baseOptions: { modelAssetPath: "./models/face_landmarker.task" },
          runningMode: "VIDEO",
          numFaces: 1,
          outputFaceBlendshapes: true,
          outputFacialTransformationMatrixes: true
        });
        status.textContent = "Kamera wird gestartet …";
        video.srcObject = await navigator.mediaDevices.getUserMedia({
          video: { width: 640, height: 480, facingMode: "user" }
        });
        await video.play();
        status.textContent = "Läuft! Schau gerade in die Kamera. Mit R kalibrierst du die Haltung neu.";
        startBtn.style.display = "none";
      } catch (err) {
        console.error(err);
        status.textContent = "Fehler: " + err.message;
        startBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
