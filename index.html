<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Face-Tracking-Avatar</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      text-align: center;
      background: #f4f6fb;
      margin: 0;
      padding: 1rem;
    }
    #stage { display: flex; flex-wrap: wrap; gap: 1rem; justify-content: center; }
    svg { width: min(90vw, 420px); background: #dfe8ff; border-radius: 16px; }
    video {
      width: 220px;
      border-radius: 16px;
      transform: scaleX(-1);
      background: #222;
      align-self: flex-start;
    }
    button { font-size: 1.1rem; padding: .6rem 1.2rem; border-radius: 8px; cursor: pointer; }
    #status { margin: 1rem; color: #444; }
    #head { transform-origin: 100px 100px; }
  </style>
</head>
<body>
  <h1>Face-Tracking-Avatar</h1>
  <button id="start">Kamera starten</button>
  <p id="status">Die Kamerabilder werden nur lokal in deinem Browser verarbeitet.</p>

  <div id="stage">
    <video id="cam" autoplay playsinline muted></video>

    <svg id="face" viewBox="0 0 200 200" aria-label="Animiertes Gesicht">
      <g id="head">
        <!-- Kopf -->
        <circle cx="100" cy="100" r="80" fill="#ffd966" stroke="#333" stroke-width="3"/>

        <!-- Augenbrauen -->
        <line id="browL" x1="52" y1="55" x2="88" y2="55" stroke="#333" stroke-width="5" stroke-linecap="round"/>
        <line id="browR" x1="112" y1="55" x2="148" y2="55" stroke="#333" stroke-width="5" stroke-linecap="round"/>

        <!-- Augen -->
        <ellipse cx="70"  cy="82" rx="16" ry="18" fill="#fff" stroke="#333" stroke-width="2"/>
        <ellipse cx="130" cy="82" rx="16" ry="18" fill="#fff" stroke="#333" stroke-width="2"/>

        <!-- Pupillen -->
        <circle id="pupilL" cx="70"  cy="82" r="7" fill="#222"/>
        <circle id="pupilR" cx="130" cy="82" r="7" fill="#222"/>

        <!-- Lider (Hautfarbe, werden beim Blinzeln heruntergezogen) -->
        <rect id="lidL" x="52"  y="62" width="36" height="0" fill="#ffd966"/>
        <rect id="lidR" x="112" y="62" width="36" height="0" fill="#ffd966"/>

        <!-- Nase -->
        <path d="M100 95 Q94 112 102 114" fill="none" stroke="#333" stroke-width="2.5" stroke-linecap="round"/>

        <!-- Mund: Innenraum + Umriss -->
        <path id="mouthFill" d="" fill="#a33"/>
        <path id="mouthLine" d="" fill="none" stroke="#333" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </svg>
  </div>

  <script type="module">
    import { FaceLandmarker, FilesetResolver } from "./vendor/vision_bundle.mjs";

    const $ = (id) => document.getElementById(id);
    const video = $("cam"), status = $("status"), startBtn = $("start");
    const head = $("head");
    const browL = $("browL"), browR = $("browR");
    const pupilL = $("pupilL"), pupilR = $("pupilR");
    const lidL = $("lidL"), lidR = $("lidR");
    const mouthFill = $("mouthFill"), mouthLine = $("mouthLine");

    let landmarker = null;

    // ---- Glättung ----
    const state = {};
    const smooth = (key, value, alpha = 0.4) => {
      state[key] = key in state ? state[key] * (1 - alpha) + value * alpha : value;
      return state[key];
    };

    const get = (shapes, name) =>
      shapes.find((s) => s.categoryName === name)?.score ?? 0;

    // ---- Mund zeichnen ----
    // open: 0..1 (Kiefer), smile: -1..1 (negativ = traurig)
    function drawMouth(open, smile, pucker) {
      const cx = 100, cy = 145;
      const halfW = 30 - pucker * 14;          // Kussmund: schmaler
      const corner = -smile * 12;              // Mundwinkel (negativ = nach oben)
      const xl = cx - halfW, xr = cx + halfW;
      const yc = cy + corner;                  // y der Mundwinkel
      const openH = open * 34;

      // Oberlippe
      const upperCtrl = cy + corner * 0.2 - 4;
      // Unterlippe
      const lowerCtrl = cy + openH * 1.3 + smile * 8 + 4;

      const upper = `M${xl} ${yc} Q${cx} ${upperCtrl} ${xr} ${yc}`;
      const lower = `Q${cx} ${lowerCtrl} ${xl} ${yc}Z`;

      mouthFill.setAttribute("d", openH > 2 ? upper + " " + lower : "");
      mouthLine.setAttribute(
        "d",
        `M${xl} ${yc} Q${cx} ${openH > 2 ? lowerCtrl : cy + smile * 12 + 2} ${xr} ${yc}` +
        (openH > 2 ? ` M${xl} ${yc} Q${cx} ${upperCtrl} ${xr} ${yc}` : "")
      );
    }

    // ---- Animation anwenden ----
    function apply(shapes, matrix) {
      const g = (n) => get(shapes, n);

      // Blinzeln
      const blinkL = smooth("blinkL", g("eyeBlinkLeft"), 0.6);
      const blinkR = smooth("blinkR", g("eyeBlinkRight"), 0.6);
      // Kamerabild ist gespiegelt: "Left" des Modells = rechte Seite des Betrachters
      // Wir spiegeln bewusst wie ein Spiegel: linkes Auge der Person = rechtes Auge im SVG
      lidR.setAttribute("height", blinkL * 40);
      lidL.setAttribute("height", blinkR * 40);

      // Blickrichtung
      const lookX = smooth("lookX",
        (g("eyeLookOutLeft") - g("eyeLookInLeft") +
         g("eyeLookInRight") - g("eyeLookOutRight")) / 2);
      const lookY = smooth("lookY",
        (g("eyeLookDownLeft") + g("eyeLookDownRight") -
         g("eyeLookUpLeft") - g("eyeLookUpRight")) / 2);
      const px = -lookX * 8, py = lookY * 8;
      pupilL.setAttribute("cx", 70 + px);  pupilL.setAttribute("cy", 82 + py);
      pupilR.setAttribute("cx", 130 + px); pupilR.setAttribute("cy", 82 + py);

      // Augenbrauen
      const up = smooth("browUp", g("browInnerUp"));
      const downL = smooth("browDownL", g("browDownLeft"));
      const downR = smooth("browDownR", g("browDownRight"));
      const outerL = smooth("browOuterL", g("browOuterUpLeft"));
      const outerR = smooth("browOuterR", g("browOuterUpRight"));
      // Spiegelung wie bei den Augen
      const yInnerR = 55 - up * 12 + downL * 8 - outerL * 4;
      const yOuterR = 55 - up * 4  - outerL * 12 + downL * 4;
      const yInnerL = 55 - up * 12 + downR * 8 - outerR * 4;
      const yOuterL = 55 - up * 4  - outerR * 12 + downR * 4;
      browL.setAttribute("y1", yOuterL); browL.setAttribute("y2", yInnerL);
      browR.setAttribute("y1", yInnerR); browR.setAttribute("y2", yOuterR);

      // Mund
      const open = smooth("open", g("jawOpen"));
      const smile = smooth("smile",
        (g("mouthSmileLeft") + g("mouthSmileRight")) / 2 * 1.4 -
        (g("mouthFrownLeft") + g("mouthFrownRight")) / 2 * 1.4);
      const pucker = smooth("pucker", g("mouthPucker"));
      drawMouth(open, Math.max(-1, Math.min(1, smile)), pucker);

      // Kopfneigung (Roll) und leichte Drehung
      if (matrix) {
        const m = matrix.data;
        const roll = Math.atan2(m[1], m[0]) * 180 / Math.PI;
        const yaw = Math.asin(Math.max(-1, Math.min(1, -m[8]))) * 180 / Math.PI;
        const r = smooth("roll", roll);
        const y = smooth("yaw", yaw);
        head.style.transform = `translateX(${y * 0.4}px) rotate(${r}deg)`;
      }
    }

    // ---- Hauptschleife ----
    let lastTime = -1;
    function loop() {
      if (video.readyState >= 2 && video.currentTime !== lastTime) {
        lastTime = video.currentTime;
        const result = landmarker.detectForVideo(video, performance.now());
        if (result.faceBlendshapes?.length > 0) {
          apply(
            result.faceBlendshapes[0].categories,
            result.facialTransformationMatrixes?.[0]
          );
        }
      }
      requestAnimationFrame(loop);
    }

    // ---- Start ----
    drawMouth(0, 0.3, 0);

    startBtn.addEventListener("click", async () => {
      startBtn.disabled = true;
      try {
        status.textContent = "Modell wird geladen …";
        const fileset = await FilesetResolver.forVisionTasks("./vendor/wasm");
        landmarker = await FaceLandmarker.createFromOptions(fileset, {
          baseOptions: { modelAssetPath: "./models/face_landmarker.task" },
          runningMode: "VIDEO",
          numFaces: 1,
          outputFaceBlendshapes: true,
          outputFacialTransformationMatrixes: true
        });

        status.textContent = "Kamera wird gestartet …";
        video.srcObject = await navigator.mediaDevices.getUserMedia({
          video: { width: 640, height: 480, facingMode: "user" }
        });
        await video.play();

        status.textContent = "Läuft! Bewege dein Gesicht, blinzle, öffne den Mund, lächle.";
        startBtn.style.display = "none";
        loop();
      } catch (err) {
        console.error(err);
        status.textContent = "Fehler: " + err.message;
        startBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
