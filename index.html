<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Face-Tracking-Avatar</title>
  <style>
    :root { --bg: #00B140; }
    body { font-family: system-ui, sans-serif; text-align: center; margin: 0; padding: 1rem; background: #f4f6fb; }
    body.clean { background: var(--bg); padding: 0; }
    body.clean .ui, body.clean video { display: none; }
    .ui { display: flex; gap: .8rem; justify-content: center; flex-wrap: wrap; align-items: center; margin-bottom: .5rem; }
    button, select { font-size: 1rem; padding: .5rem 1rem; border-radius: 8px; cursor: pointer; }
    #status { margin: .5rem; color: #444; }
    #stage { display: flex; flex-wrap: wrap; gap: 1rem; justify-content: center; }
    #avatar { width: min(90vw, 560px); background: var(--bg); border-radius: 16px; }
    body.clean #avatar { width: min(100vw, 100vh); border-radius: 0; margin: 0 auto; }
    #avatar svg { display: block; width: 100%; height: auto; }
    video { width: 220px; border-radius: 16px; transform: scaleX(-1); background: #222; align-self: flex-start; }
  </style>
</head>
<body>
  <div class="ui">
    <h1 style="width:100%;margin:.2rem">Face-Tracking-Avatar</h1>
    <button id="start">Kamera starten</button>
    <label>Hintergrund:
      <select id="bgSelect">
        <option value="#00B140">Greenscreen (#00B140)</option>
        <option value="#00FF00">Hellgrün (#00FF00)</option>
        <option value="#0047BB">Bluescreen (#0047BB)</option>
        <option value="#FF00FF">Magenta (#FF00FF)</option>
        <option value="#dfe8ff">Hellblau (neutral)</option>
      </select>
    </label>
    <button id="cleanBtn">Nur Avatar anzeigen</button>
  </div>
  <p id="status" class="ui">Die Kamerabilder werden nur lokal in deinem Browser verarbeitet.</p>

  <div id="stage">
    <video id="cam" autoplay playsinline muted></video>
    <div id="avatar" aria-label="Animierter Philosoph"></div>
  </div>

  <script type="module">
    import { FaceLandmarker, FilesetResolver } from "./vendor/vision_bundle.mjs";

    const $ = (id) => document.getElementById(id);
    const video = $("cam"), status = $("status"), startBtn = $("start");

    // ---------- Hintergrund ----------
    const root = document.documentElement;
    const savedBg = localStorage.getItem("avatarBg");
    if (savedBg) { root.style.setProperty("--bg", savedBg); $("bgSelect").value = savedBg; }
    $("bgSelect").addEventListener("change", (e) => {
      root.style.setProperty("--bg", e.target.value);
      localStorage.setItem("avatarBg", e.target.value);
    });

    // "Nur Avatar" per Button oder ?clean in der URL (z. B. für OBS)
    const setClean = (on) => document.body.classList.toggle("clean", on);
    $("cleanBtn").addEventListener("click", () => setClean(true));
    document.addEventListener("keydown", (e) => { if (e.key === "Escape") setClean(false); });
    if (new URLSearchParams(location.search).has("clean")) setClean(true);

    // ---------- SVG laden ----------
    const res = await fetch("./assets/philosoph.svg");
    $("avatar").innerHTML = await res.text();

    const el = {
      head: $("head"),
      irisL: $("irisL"), irisR: $("irisR"),
      lidL: $("lidL"), lidR: $("lidR"),
      browL: [$("browL"), $("browL2")],
      browR: [$("browR"), $("browR2")],
      mouthFill: $("mouthFill"), mouthLine: $("mouthLine")
    };

    // ---------- Hilfsfunktionen ----------
    const state = {};
    const smooth = (key, v, a = 0.4) =>
      (state[key] = key in state ? state[key] * (1 - a) + v * a : v);
    const get = (shapes, name) => shapes.find((s) => s.categoryName === name)?.score ?? 0;
    const setBrow = (lines, y1, y2) =>
      lines.forEach((l) => { l.setAttribute("y1", y1); l.setAttribute("y2", y2); });

    // ---------- Mund ----------
    function drawMouth(open, smile, pucker) {
      const cx = 348, cy = 358;
      const halfW = 30 - pucker * 14;
      const yc = cy - smile * 8;               // Mundwinkel
      const xl = cx - halfW, xr = cx + halfW;
      const openH = open * 40;
      const upperCtrl = cy - 4;
      const lowerCtrl = cy + openH * 1.3 + 4;

      if (openH > 2) {
        el.mouthFill.setAttribute("d",
          `M${xl} ${yc} Q${cx} ${upperCtrl} ${xr} ${yc} Q${cx} ${lowerCtrl} ${xl} ${yc}Z`);
        el.mouthLine.setAttribute("d",
          `M${xl} ${yc} Q${cx} ${lowerCtrl} ${xr} ${yc} M${xl} ${yc} Q${cx} ${upperCtrl} ${xr} ${yc}`);
      } else {
        el.mouthFill.setAttribute("d", "");
        el.mouthLine.setAttribute("d",
          `M${xl} ${yc} Q${cx} ${cy + 4 + smile * 10} ${xr} ${yc}`);
      }
    }

    // ---------- Animation ----------
    // Spiegelprinzip: linkes Auge der Person = rechtes Auge im Bild
    function apply(shapes, matrix) {
      const g = (n) => get(shapes, n);

      // Blinzeln
      el.lidR.setAttribute("height", smooth("blinkL", g("eyeBlinkLeft"), 0.6) * 42);
      el.lidL.setAttribute("height", smooth("blinkR", g("eyeBlinkRight"), 0.6) * 42);

      // Blick
      const lookX = smooth("lookX",
        (g("eyeLookOutLeft") - g("eyeLookInLeft") +
         g("eyeLookInRight") - g("eyeLookOutRight")) / 2);
      const lookY = smooth("lookY",
        (g("eyeLookDownLeft") + g("eyeLookDownRight") -
         g("eyeLookUpLeft") - g("eyeLookUpRight")) / 2);
      const t = `translate(${-lookX * 12} ${lookY * 6})`;
      el.irisL.setAttribute("transform", t);
      el.irisR.setAttribute("transform", t);

      // Augenbrauen
      const up = smooth("browUp", g("browInnerUp"));
      const dL = smooth("dL", g("browDownLeft")),  dR = smooth("dR", g("browDownRight"));
      const oL = smooth("oL", g("browOuterUpLeft")), oR = smooth("oR", g("browOuterUpRight"));
      // Bild rechts = Person links
      setBrow(el.browR, 190 - up * 18 + dL * 12, 198 - up * 6 - oL * 16 + dL * 6);
      // Bild links = Person rechts (x1 = außen, x2 = innen)
      setBrow(el.browL, 198 - up * 6 - oR * 16 + dR * 6, 190 - up * 18 + dR * 12);

      // Mund
      const open = smooth("open", g("jawOpen"));
      const smile = smooth("smile",
        ((g("mouthSmileLeft") + g("mouthSmileRight")) -
         (g("mouthFrownLeft") + g("mouthFrownRight"))) / 2 * 1.4);
      drawMouth(open, Math.max(-1, Math.min(1, smile)), smooth("pucker", g("mouthPucker")));

      // Kopf
      if (matrix) {
        const m = matrix.data;
        const roll = smooth("roll", Math.atan2(m[1], m[0]) * 180 / Math.PI);
        const yaw = smooth("yaw",
          Math.asin(Math.max(-1, Math.min(1, -m[8]))) * 180 / Math.PI);
        el.head.style.transform = `translateX(${yaw * 1.2}px) rotate(${roll}deg)`;
      }
    }

    // ---------- Schleife ----------
    let landmarker = null, lastTime = -1;
    function loop() {
      if (video.readyState >= 2 && video.currentTime !== lastTime) {
        lastTime = video.currentTime;
        const r = landmarker.detectForVideo(video, performance.now());
        if (r.faceBlendshapes?.length > 0) {
          apply(r.faceBlendshapes[0].categories, r.facialTransformationMatrixes?.[0]);
        }
      }
      requestAnimationFrame(loop);
    }

    drawMouth(0, 0.1, 0);

    startBtn.addEventListener("click", async () => {
      startBtn.disabled = true;
      try {
        status.textContent = "Modell wird geladen …";
        const fileset = await FilesetResolver.forVisionTasks("./vendor/wasm");
        landmarker = await FaceLandmarker.createFromOptions(fileset, {
          baseOptions: { modelAssetPath: "./models/face_landmarker.task" },
          runningMode: "VIDEO",
          numFaces: 1,
          outputFaceBlendshapes: true,
          outputFacialTransformationMatrixes: true
        });
        status.textContent = "Kamera wird gestartet …";
        video.srcObject = await navigator.mediaDevices.getUserMedia({
          video: { width: 640, height: 480, facingMode: "user" }
        });
        await video.play();
        status.textContent = "Läuft! Mit Esc kommst du aus der Avatar-Ansicht zurück.";
        startBtn.style.display = "none";
        loop();
      } catch (err) {
        console.error(err);
        status.textContent = "Fehler: " + err.message;
        startBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
