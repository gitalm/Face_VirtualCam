name: Figurenliste aktualisieren

on:
  push:
    branches: [main]
    paths:
      - "assets/*.svg"
  workflow_dispatch:   # zusätzlich manuell startbar

permissions:
  contents: write      # nötig, damit die Action committen darf

jobs:
  update-figures:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: figures.json erzeugen
        run: |
          cd assets
          ls -1 *.svg | sort | jq -R . | jq -s . > figures.json
          cat figures.json

      - name: Änderung committen
        run: |
          if git diff --quiet -- assets/figures.json; then
            echo "Keine Änderung."
          else
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/figures.json
            git commit -m "figures.json automatisch aktualisiert"
            git push
          fi
