<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 720">

<defs>

  <!-- Haut -->
  <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#f9d0ad"/>
    <stop offset=".5" stop-color="#edb58e"/>
    <stop offset="1" stop-color="#ce8968"/>
  </linearGradient>

  <radialGradient id="skinLight">
    <stop offset="0" stop-color="#ffe0c3"/>
    <stop offset="1" stop-color="#e8a780"/>
  </radialGradient>

  <!-- Perücke -->
  <linearGradient id="wig" x1="0" y1="0" x2=".8" y2="1">
    <stop offset="0" stop-color="#fffef9"/>
    <stop offset=".45" stop-color="#e9e6dc"/>
    <stop offset="1" stop-color="#aaa99f"/>
  </linearGradient>

  <linearGradient id="wigShadow" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#c1bfb6"/>
    <stop offset=".5" stop-color="#f9f7ef"/>
    <stop offset="1" stop-color="#c3c0b7"/>
  </linearGradient>

  <!-- Kleidung -->
  <linearGradient id="coat" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#34404c"/>
    <stop offset=".45" stop-color="#202c3a"/>
    <stop offset="1" stop-color="#111b28"/>
  </linearGradient>

  <linearGradient id="coatLight" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#536071"/>
    <stop offset="1" stop-color="#253344"/>
  </linearGradient>

  <linearGradient id="shirt" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#ffffff"/>
    <stop offset="1" stop-color="#d6d9d5"/>
  </linearGradient>

  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#fff0a8"/>
    <stop offset=".5" stop-color="#c99b3e"/>
    <stop offset="1" stop-color="#806025"/>
  </linearGradient>

  <!-- Augen -->
  <radialGradient id="irisColor" cx=".4" cy=".35" r=".7">
    <stop offset="0" stop-color="#a8d9e8"/>
    <stop offset=".5" stop-color="#548fae"/>
    <stop offset="1" stop-color="#25465f"/>
  </radialGradient>

  <!-- Augenclips -->
  <clipPath id="clipEyeL">
    <ellipse cx="292" cy="240" rx="28" ry="21"/>
  </clipPath>

  <clipPath id="clipEyeR">
    <ellipse cx="405" cy="244" rx="28" ry="21"/>
  </clipPath>

  <!-- Einzelne Perückenlocke -->
  <g id="curl">
    <path d="M0 0
             C-13 -13 -12 -28 1 -31
             C17 -34 23 -18 12 -9
             C5 -3 -2 -8 1 -16
             C4 -22 12 -18 9 -13"
          fill="none"
          stroke="#aaa99f"
          stroke-width="7"
          stroke-linecap="round"/>

    <path d="M0 0
             C-13 -13 -12 -28 1 -31
             C17 -34 23 -18 12 -9"
          fill="none"
          stroke="#fffef8"
          stroke-width="3.5"
          stroke-linecap="round"/>
  </g>

</defs>


